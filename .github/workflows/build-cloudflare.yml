name: Build Cloudflare bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/lingua.db
      AUTH_SECRET: build-only-secret-please-change-1234567890
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: |
          mkdir -p data
          npm run cf:build

      - name: Report bundle size
        run: |
          du -sh .open-next .open-next/server-functions/default
          ls -lh .open-next/worker.js
          gzip -c .open-next/worker.js | wc -c
          find .open-next/assets -type f | wc -l

      - name: Bundle for Workers (dry run)
        run: |
          npx wrangler deploy --dry-run --outdir cf-dist --metafile=cf-meta.json
          du -sh cf-dist
          ls -lh cf-dist
          node -e "const m=require('./cf-meta.json');const inputs=m.inputs||{};const first=Object.entries(inputs)[0];if(first)console.log('meta keys',Object.keys(first[1]));const rows=Object.entries(inputs).map(([k,v])=>[k,v.bytes||v.bytesInOutput||0]).sort((a,b)=>b[1]-a[1]).slice(0,25);for(const [k,v] of rows) console.log((v/1024).toFixed(1)+' KB', k)"
