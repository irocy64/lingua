services:
  - type: web
    name: lingua
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start:standalone
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_ALLOWED_EMAILS
        sync: false
      - key: AI_DAILY_LIMIT_PER_USER
        value: "100"
      - key: AI_DAILY_LIMIT_GLOBAL
        value: "300"
