services:
  - type: web
    name: lingua
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start:standalone
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        value: libsql://lingua-irocy64.aws-ap-northeast-1.turso.io
      - key: OWNER_EMAIL
        value: 1245411039@qq.com
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_AUTH_TOKEN
        sync: false
